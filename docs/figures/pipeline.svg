<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="16" fill="#fcfcfb"/>

  <!-- 1 histories -->
  <g transform="translate(24,40)">
    <rect width="200" height="220" rx="12" fill="#ffffff" stroke="#e6e5e1"/>
    <text x="16" y="30" font-size="13" font-weight="700" fill="#0b0b0b">1 · Exposure histories</text>
    <text x="16" y="50" font-size="11" fill="#52514e">dated doses &amp; positives</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <rect x="16" y="70" width="168" height="30" rx="6" fill="#eef4fc"/>
      <text x="28" y="90" fill="#2a78d6" font-weight="700">B</text><text x="44" y="90" fill="#2a78d6" font-weight="700">B</text><text x="60" y="90" fill="#2a78d6" font-weight="700">B</text><text x="76" y="90" fill="#0b0b0b" font-weight="700">I</text>
      <text x="100" y="90" fill="#52514e" font-size="10.5" font-family="Inter, Helvetica, sans-serif">3 doses, then I</text>
      <rect x="16" y="110" width="168" height="30" rx="6" fill="#fdf0ea"/>
      <text x="28" y="130" fill="#eb6834" font-weight="700">S</text><text x="44" y="130" fill="#eb6834" font-weight="700">S</text><text x="60" y="130" fill="#0b0b0b" font-weight="700">I</text>
      <text x="100" y="130" fill="#52514e" font-size="10.5" font-family="Inter, Helvetica, sans-serif">2 doses, then I</text>
      <rect x="16" y="150" width="168" height="30" rx="6" fill="#eef4fc"/>
      <text x="28" y="170" fill="#2a78d6" font-weight="700">B</text><text x="44" y="170" fill="#2a78d6" font-weight="700">B</text>
      <text x="100" y="170" fill="#52514e" font-size="10.5" font-family="Inter, Helvetica, sans-serif">reference</text>
    </g>
    <text x="16" y="205" font-size="11" fill="#8a8984">vvi.sequence.encode()</text>
  </g>
  <line x1="232" y1="150" x2="262" y2="150" stroke="#8a8984" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 risk set -->
  <g transform="translate(268,40)">
    <rect width="200" height="220" rx="12" fill="#ffffff" stroke="#e6e5e1"/>
    <text x="16" y="30" font-size="13" font-weight="700" fill="#0b0b0b">2 · Calendar risk set</text>
    <text x="16" y="50" font-size="11" fill="#52514e">at risk / blanked / event</text>
    <g>
      <rect x="16" y="76" width="70" height="10" rx="5" fill="#2a78d6"/>
      <circle cx="86" cy="81" r="6" fill="#0b0b0b"/>
      <rect x="92" y="78" width="40" height="6" rx="3" fill="#e6e5e1"/>
      <rect x="132" y="76" width="52" height="10" rx="5" fill="#2a78d6"/>
      <rect x="40" y="106" width="144" height="10" rx="5" fill="#eb6834"/>
      <rect x="16" y="136" width="110" height="10" rx="5" fill="#2a78d6"/>
      <circle cx="126" cy="141" r="6" fill="#0b0b0b"/>
      <rect x="132" y="138" width="52" height="6" rx="3" fill="#e6e5e1"/>
      <line x1="16" y1="166" x2="184" y2="166" stroke="#c3c2b7"/>
      <text x="16" y="182" font-size="10" fill="#8a8984">Jan</text><text x="168" y="182" font-size="10" fill="#8a8984">Dec</text>
    </g>
    <text x="16" y="205" font-size="11" fill="#8a8984">vvi.riskset.at_risk_intervals()</text>
  </g>
  <line x1="476" y1="150" x2="506" y2="150" stroke="#8a8984" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 sufficient statistics -->
  <g transform="translate(512,40)">
    <rect width="200" height="220" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="16" y="30" font-size="13" font-weight="700" fill="#0b0b0b">3 · Sufficient statistics</text>
    <text x="16" y="50" font-size="11" fill="#52514e">(cell, day) → at risk, events</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="16" y="78" fill="#8a8984">cell</text><text x="104" y="78" fill="#8a8984">day</text><text x="136" y="78" fill="#8a8984">n</text><text x="176" y="78" fill="#8a8984">d</text>
      <text x="16" y="96" fill="#0b0b0b">BBBI·F·18</text><text x="104" y="96" fill="#0b0b0b">70</text><text x="136" y="96" fill="#0b0b0b">4812</text><text x="176" y="96" fill="#0b0b0b">3</text>
      <text x="16" y="114" fill="#0b0b0b">BBBI·F·18</text><text x="104" y="114" fill="#0b0b0b">71</text><text x="136" y="114" fill="#0b0b0b">4809</text><text x="176" y="114" fill="#0b0b0b">5</text>
      <text x="16" y="132" fill="#0b0b0b">SSI·M·60</text><text x="104" y="132" fill="#0b0b0b">70</text><text x="136" y="132" fill="#0b0b0b">1290</text><text x="176" y="132" fill="#0b0b0b">1</text>
      <text x="16" y="152" fill="#8a8984" font-family="Inter, Helvetica, sans-serif">… at most cells × days rows</text>
    </g>
    <text x="16" y="180" font-size="11" fill="#2a78d6" font-weight="700">10⁸ person-days → 10⁴ rows</text>
    <text x="16" y="205" font-size="11" fill="#8a8984">vvi.riskset.aggregate()</text>
  </g>
  <line x1="720" y1="150" x2="750" y2="150" stroke="#8a8984" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 model -->
  <g transform="translate(756,40)">
    <rect width="180" height="220" rx="12" fill="#ffffff" stroke="#e6e5e1"/>
    <text x="16" y="30" font-size="13" font-weight="700" fill="#0b0b0b">4 · cloglog GLM</text>
    <text x="16" y="50" font-size="11" fill="#52514e">exact same MLE</text>
    <text x="16" y="84" font-size="12" fill="#0b0b0b" font-style="italic">cloglog p = η(t)</text>
    <text x="34" y="104" font-size="12" fill="#0b0b0b" font-style="italic">+ α′x + β<tspan font-size="9" baseline-shift="sub">profile</tspan></text>
    <path d="M18,150 C40,150 46,122 62,122 C78,122 82,150 104,148 C124,146 132,132 150,134 L164,140" fill="none" stroke="#2a78d6" stroke-width="2"/>
    <text x="16" y="172" font-size="11" fill="#52514e">HR · PE = 1 − HR</text>
    <text x="16" y="205" font-size="11" fill="#8a8984">vvi.model.fit()</text>
  </g>
</svg>
