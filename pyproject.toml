[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vvi"
version = "0.2.0"
description = "Hybrid immunity and immune imprinting in calendar time: exact, sampling-free discrete-time hazard models for vaccination–infection histories."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ziyi Zhou" }]
requires-python = ">=3.10"
keywords = ["epidemiology", "vaccine effectiveness", "survival analysis", "discrete-time hazard", "recurrent events", "COVID-19", "hybrid immunity", "immune imprinting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14", "patsy>=0.5.6"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "pillow>=9"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.8", "matplotlib>=3.7", "pillow>=9", "nbformat>=5", "nbclient>=0.9", "ipykernel>=6"]

[project.scripts]
vvi = "vvi.cli:main"

[project.urls]
Homepage = "https://ellensyuu.github.io/VVI/"
Repository = "https://github.com/EllenSyuu/VVI"
Changelog = "https://github.com/EllenSyuu/VVI/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/vvi"]

[tool.hatch.build.targets.sdist]
exclude = ["build", "docs/img"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
packages = ["vvi"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["vvi"]
omit = ["*/vvi/cli.py"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_notebook.py" = ["E501"]
